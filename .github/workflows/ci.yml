name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build (iOS)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LyricsX-iOS.xcodeproj

      - name: Build
        run: |
          xcodebuild build \
            -project LyricsX-iOS.xcodeproj \
            -scheme "LyricsX-iOS" \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -e
          PRODUCTS_DIR="DerivedData/Build/Products/Debug-iphoneos"
          PAYLOAD_DIR="Payload"
          rm -rf "$PAYLOAD_DIR"
          mkdir "$PAYLOAD_DIR"
          cp -R "$PRODUCTS_DIR"/*.app "$PAYLOAD_DIR"/
          zip -r -y LyricsX-iOS-unsigned.ipa "$PAYLOAD_DIR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricsX-iOS
          path: DerivedData/Build/Products/Debug-iphoneos/*.app
          if-no-files-found: error

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricsX-iOS-unsigned-ipa
          path: LyricsX-iOS-unsigned.ipa
          if-no-files-found: error
